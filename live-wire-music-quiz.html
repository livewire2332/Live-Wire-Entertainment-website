<body>
<div class="quiz-hero"><img class="logo" src="live-wire-logo.jpg" alt="Live Wire Entertainment logo"><div class="bolt">⚡</div><h1>🎵 Live Wire Music Quiz</h1><p>10 questions from a much bigger music pool — fresh questions and shuffled answers each time.</p><p class="fresh-note">Questions are kept fresh so you don't keep getting the same set over and over. ⚡</p></div>

function shuffle(a){
  const x=a.slice();
  for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}
  return x;
}
function loadUsed(){
  try{const v=JSON.parse(localStorage.getItem(STORE)||'[]');return Array.isArray(v)?v.filter(i=>Number.isInteger(i)&&i>=0&&i<questions.length):[];}catch(_){return []}
}
function saveUsed(v){try{localStorage.setItem(STORE,JSON.stringify(v));}catch(_){}}
function nextQuestionSet(){
  let used=loadUsed();
  let available=questions.map((_,i)=>i).filter(i=>!used.includes(i));
  if(available.length<10){used=[];available=questions.map((_,i)=>i);}
  const chosen=shuffle(available).slice(0,10);
  saveUsed(used.concat(chosen));
  return chosen.map(i=>questions[i]);
}

let round=nextQuestionSet();
let index=0,score=0,answered=false;
const q=document.getElementById('question'),a=document.getElementById('answers'),f=document.getElementById('feedback');
const p=document.getElementById('progress'),n=document.getElementById('next'),box=document.getElementById('quiz'),streak=document.getElementById('streak');

function render(){
  answered=false;n.hidden=true;f.textContent='';
  const item=round[index];
  p.textContent='Question '+(index+1)+' of '+round.length;
  streak.textContent='Fresh round • '+(questions.length)+' questions in the master pool';
  q.textContent=item[0];a.innerHTML='';
  const correctText=item[1][item[2]];
  const options=shuffle(item[1]);
  options.forEach(label=>{
    const b=document.createElement('button');b.type='button';b.className='answer';b.textContent=label;
    b.addEventListener('click',()=>choose(label,b,correctText));a.appendChild(b);
  });
}
function choose(label,b,correctText){
  if(answered)return;answered=true;
  document.querySelectorAll('.answer').forEach(x=>x.disabled=true);
  if(label===correctText){score++;b.classList.add('correct');f.textContent='⚡ Correct! That one belongs in the Live Wire memory bank.';}
  else{b.classList.add('wrong');document.querySelectorAll('.answer').forEach(x=>{if(x.textContent===correctText)x.classList.add('correct');});f.textContent='Not quite! The correct answer is '+correctText+'. Keep the tunes coming!';}
  n.hidden=false;n.textContent=index===round.length-1?'See My Score 🏆':'Next Question ⚡';
}
n.addEventListener('click',()=>{
  if(index<round.length-1){index++;render();}else{showResult();}
});
function showResult(){
  box.innerHTML='<div class="result"><div class="progress">QUIZ COMPLETE ⚡</div><div class="score">'+score+'/10</div><h2>'+resultText()+'</h2><p>Fancy another go? The next round is pulled from the wider question pool, so it will not simply repeat this set.</p><button class="quiz-btn" type="button" id="again">🔄 Fresh Quiz</button></div>';
  document.getElementById('again').addEventListener('click',()=>location.reload());
}
function resultText(){
  if(score===10)return'ABSOLUTE LIVE WIRE LEGEND! 🎵';
  if(score>=8)return'LIVE WIRE QUIZ MASTER! 🔥';
  if(score>=6)return'PROPER TUNE SPOTTER! ⚡';
  if(score>=4)return'NOT BAD, BUT THE JUKEBOX WANTS MORE! 😂';
  return'BACK TO THE LIVE WIRE BAR FOR SOME REVISION! 🍹😂';
}
render();
})();
</script>
