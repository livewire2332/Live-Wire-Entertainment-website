name: Fix More Games Loader

on:
  push:
    paths:
      - '.github/workflows/fix-more-games-buttons.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure new games script is loaded
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('live-wire-extras.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="live-wire-more-games.js"></script>'
          if tag not in s:
              s = s.replace('</body>', tag + '\n</body>')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live-wire-extras.html
          git diff --cached --quiet || git commit -m "Load Live Wire Arcade new games"
          git push
