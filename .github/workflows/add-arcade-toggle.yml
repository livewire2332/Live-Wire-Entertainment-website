name: Add Arcade Toggle

on:
  push:
    paths:
      - '.github/workflows/add-arcade-toggle.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add toggle script to Fun and Extras
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('live-wire-extras.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="live-wire-arcade-toggle.js"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live-wire-extras.html
          git diff --cached --quiet || git commit -m 'Add expandable Live Wire Arcade'
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/add-arcade-toggle.yml
          git commit -m 'Remove temporary Arcade toggle workflow'
          git push
