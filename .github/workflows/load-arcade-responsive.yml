name: Load Arcade Responsive Fix

on:
  push:
    paths:
      - '.github/workflows/load-arcade-responsive.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load responsive Arcade stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('live-wire-extras.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="live-wire-arcade-responsive.js"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live-wire-extras.html
          git diff --cached --quiet || git commit -m 'Make all new Arcade games responsive'
          git push
      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/load-arcade-responsive.yml
          git commit -m 'Remove one-time Arcade responsive fixer'
          git push
