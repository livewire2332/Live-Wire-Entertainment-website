name: Tidy Fun & Extras order

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'live-wire-extras.html'
      - 'live-wire-extras.js'
      - 'live-wire-more-games.js'

permissions:
  contents: write

jobs:
  tidy:
    if: "!contains(github.event.head_commit.message, '[fun-extras-order-done]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Move archive sections below interactive zone
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('live-wire-extras.html')
          s = p.read_text(encoding='utf-8')

          body_start = s.find('<body>')
          body_end = s.rfind('</body>')
          if body_start < 0 or body_end < 0:
              raise SystemExit('Could not locate body')

          before = s[:body_start]
          body = s[body_start:body_end]
          after = s[body_end:]

          section_pattern = re.compile(r'<section class="extras-section">.*?</section>', re.S)
          blocks = [m.group(0) for m in section_pattern.finditer(body)]

          def find_block(text):
              return next((b for b in blocks if text in b), None)

          memories = find_block('<h1>📸 Live Wire Memories</h1>')
          hall = find_block('<h1>🏆 Live Wire Hall of Fame</h1>')
          nav = next((b for b in blocks if 'Back To The Live Wire Bar' in b and 'Back To Live Wire Entertainment' in b), None)

          # The quirky marker sits immediately before its section, so locate the
          # section by searching forward from the marker rather than expecting
          # the comment to be inside the section match.
          quirky_marker = '<!-- LIVE-WIRE-QUIRKY-EXTRAS -->'
          qm = body.find(quirky_marker)
          interactive = None
          if qm >= 0:
              m = section_pattern.search(body, qm)
              if m:
                  interactive = m.group(0)

          if not all([interactive, memories, hall, nav]):
              raise SystemExit(f'Missing target block: interactive={bool(interactive)} memories={bool(memories)} hall={bool(hall)} nav={bool(nav)}')

          # Remove only the three archive/navigation blocks. Leave the entire
          # quirky interactive block exactly where it already is.
          for target in [memories, hall, nav]:
              body = body.replace(target, '', 1)

          # Re-find the interactive block after removals and place Memories,
          # Hall of Fame and navigation directly after it.
          qm = body.find(quirky_marker)
          m = section_pattern.search(body, qm)
          if not m:
              raise SystemExit('Interactive block disappeared unexpectedly')
          end = m.end()
          ordered = '\n' + memories + '\n' + hall + '\n' + nav + '\n'
          body = body[:end] + ordered + body[end:]

          p.write_text(before + body + after, encoding='utf-8')
          PY

      - name: Commit tidy layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live-wire-extras.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Tidy Fun & Extras section order [fun-extras-order-done]"
            git push
          fi
