name: Add Live Wire Fun Arcade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-fun-arcade.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add new Fun & Extras games
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('live-wire-extras.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- LIVE-WIRE-QUIRKY-EXTRAS -->'
          insert=r'''<section class="extras-section"><div class="wrap"><h1>🎮⚡ Live Wire Arcade</h1><p>A whole new collection of quick-fire Live Wire nonsense. None of these repeat the games above. 😂</p><div class="quirky-grid">
          <div class="quirky-card"><div class="mini-label">Banter meter</div><h2>🔥 The Savage Meter</h2><p class="quirky-sub">How dangerous is today's Live Wire banter?</p><div id="savageResult" class="quirky-random">PRESS IT IF YOU DARE...</div><button type="button" class="fun-btn" id="savageBtn">🔥 MEASURE THE SAVAGE</button></div>
          <div class="quirky-card"><div class="mini-label">Three wheels of chaos</div><h2>🎰 Live Wire Slot Machine</h2><p class="quirky-sub">Spin all three and see what Live Wire nonsense you've been assigned.</p><div id="slotResult" class="quirky-random">⚡ | 🎵 | 😂</div><button type="button" class="fun-btn" id="slotBtn">🎰 SPIN THE CHAOS</button></div>
          <div class="quirky-card"><div class="mini-label">Investigation underway</div><h2>🚨 Who Caused The Chaos?</h2><p class="quirky-sub">Someone is responsible. The evidence is questionable.</p><div id="chaosResult" class="quirky-random">THE CASE IS OPEN...</div><button type="button" class="fun-btn" id="chaosBtn">🚨 NAME THE CULPRIT</button></div>
          <div class="quirky-card"><div class="mini-label">No excuse is too ridiculous</div><h2>🧨 The Excuse Generator</h2><p class="quirky-sub">Why is Will late? Why did Dan play another tune? Find out.</p><div id="excuseResult" class="quirky-random">WHAT'S THE EXCUSE?</div><button type="button" class="fun-btn" id="excuseBtn">🧨 GENERATE EXCUSE</button></div>
          <div class="quirky-card"><div class="mini-label">Dangerous levels of confidence</div><h2>🎤 Karaoke Confidence Meter</h2><p class="quirky-sub">Find out exactly how brave you are with a microphone.</p><div id="karaokeResult" class="quirky-random">MICROPHONE STATUS: UNKNOWN</div><button type="button" class="fun-btn" id="karaokeBtn">🎤 CHECK MY CONFIDENCE</button></div>
          <div class="quirky-card"><div class="mini-label">Decade detective</div><h2>🕵️ Name That Decade</h2><p class="quirky-sub">A music clue appears. Guess the decade.</p><div id="decadeGame" class="quirky-big">Which decade gave us “Mr. Brightside”?</div><div id="decadeChoices" class="quirky-choices"></div><div id="decadeAnswer" class="quirky-answer">Choose an answer...</div></div>
          <div class="quirky-card"><div class="mini-label">DJ selector</div><h2>🎧 Pick Your DJ</h2><p class="quirky-sub">Pick a mood and see who Live Wire assigns.</p><div id="djResult" class="quirky-random">YOUR DJ IS WAITING...</div><button type="button" class="fun-btn" id="djBtn">🎧 PICK MY DJ</button></div>
          <div class="quirky-card"><div class="mini-label">Radio time machine</div><h2>📻 Radio Time Machine</h2><p class="quirky-sub">Choose an era and receive a completely fictional Live Wire broadcast bulletin.</p><div id="radioResult" class="quirky-random">SELECT YOUR ERA...</div><div class="quirky-choices"><button class="quirky-choice" data-radio="60s">60s</button><button class="quirky-choice" data-radio="70s">70s</button><button class="quirky-choice" data-radio="80s">80s</button><button class="quirky-choice" data-radio="90s">90s</button><button class="quirky-choice" data-radio="00s">00s</button></div></div>
          <div class="quirky-card"><div class="mini-label">Absolutely essential</div><h2>🎶 One More Tune Generator</h2><p class="quirky-sub">Because apparently the night isn't finished yet.</p><div id="oneMoreResult" class="quirky-random">ONE MORE WHAT?</div><button type="button" class="fun-btn" id="oneMoreBtn">🎶 JUST ONE MORE...</button></div>
          <div class="quirky-card"><div class="mini-label">All aboard</div><h2>🎫 Music Train Ticket Generator</h2><p class="quirky-sub">Your completely unnecessary but very official Live Wire ticket.</p><div id="ticketResult" class="quirky-answer">PASSENGER: YOU • DESTINATION: UNKNOWN</div><button type="button" class="fun-btn" id="ticketBtn">🎫 PRINT MY TICKET</button></div>
          <div class="quirky-card"><div class="mini-label">Railway control room</div><h2>🚦 Music Train Status</h2><p class="quirky-sub">Check today's highly unofficial railway report.</p><div id="railResult" class="quirky-random">CHECK THE BOARD...</div><button type="button" class="fun-btn" id="railBtn">🚦 CHECK STATUS</button></div>
          <div class="quirky-card"><div class="mini-label">Your journey</div><h2>🗺️ Build Your Music Train Journey</h2><p class="quirky-sub">Pick three decades and we'll create your route.</p><div class="quirky-choices"><button class="quirky-choice route" data-route="50s">50s</button><button class="quirky-choice route" data-route="70s">70s</button><button class="quirky-choice route" data-route="80s">80s</button><button class="quirky-choice route" data-route="90s">90s</button><button class="quirky-choice route" data-route="00s">00s</button><button class="quirky-choice route" data-route="10s">10s</button></div><div id="routeResult" class="quirky-answer">Pick three stops...</div></div>
          <div class="quirky-card"><div class="mini-label">Head-to-head</div><h2>🥊 Dan vs Will Challenge</h2><p class="quirky-sub">A fresh challenge that isn't the same as the other Dan vs Will game.</p><div id="challengeResult" class="quirky-random">WHO'S GETTING CHALLENGED?</div><button type="button" class="fun-btn" id="challengeBtn">🥊 GIVE US A CHALLENGE</button></div>
          <div class="quirky-card"><div class="mini-label">Mystery quote</div><h2>🎯 Who Said It?</h2><p class="quirky-sub">Guess whether the quote belongs to Dan or Will.</p><div id="quoteGame" class="quirky-big">“I only need one more tune.”</div><div class="quirky-choices"><button class="quirky-choice quotePick" data-quote="Dan">⚡ DAN</button><button class="quirky-choice quotePick" data-quote="Will">🔥 WILL</button></div><div id="quoteAnswer" class="quirky-answer">Who said it?</div></div>
          <div class="quirky-card"><div class="mini-label">Your official result</div><h2>🏆 Live Wire Personality Badge</h2><p class="quirky-sub">Tap the button and receive your completely unofficial Live Wire identity.</p><div id="badgeResult" class="quirky-random">YOUR BADGE IS WAITING...</div><button type="button" class="fun-btn" id="badgeBtn">🏆 GIVE ME MY BADGE</button></div>
          <div class="quirky-card"><div class="mini-label">Live Wire Bar</div><h2>🍹 What's Your Live Wire Drink?</h2><p class="quirky-sub">Fictional Live Wire drinks only — choose your destiny.</p><div id="drinkResult" class="quirky-random">THE BAR IS WAITING...</div><button type="button" class="fun-btn" id="drinkBtn">🍹 MIX MY DRINK</button></div>
          <div class="quirky-card"><div class="mini-label">Bar order</div><h2>🍸 Bar Order Generator</h2><p class="quirky-sub">Your completely random Live Wire Bar order has arrived.</p><div id="orderResult" class="quirky-answer">YOUR ORDER IS BEING PREPARED...</div><button type="button" class="fun-btn" id="orderBtn">🍸 GIVE ME AN ORDER</button></div>
          <div class="quirky-card"><div class="mini-label">Reserved seating</div><h2>🪑 Where Are You Sitting?</h2><p class="quirky-sub">Your Live Wire Bar seat has been allocated.</p><div id="seatResult" class="quirky-random">FINDING YOUR SEAT...</div><button type="button" class="fun-btn" id="seatBtn">🪑 FIND MY SEAT</button></div>
          <div class="quirky-card"><div class="mini-label">Today's mission</div><h2>⚡ Live Wire Daily Challenge</h2><p class="quirky-sub">A fresh mini challenge every time you press it.</p><div id="dailyResult" class="quirky-random">TODAY'S MISSION AWAITS...</div><button type="button" class="fun-btn" id="dailyBtn">⚡ GIVE ME A CHALLENGE</button></div>
          </div></div></section>
          <script>
          (function(){'use strict';
          const pick=a=>a[Math.floor(Math.random()*a.length)];
          const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
          const savage=['MILD — YOU'RE SAFE. FOR NOW. 😂','CHEEKY — SOMEONE'S GETTING WOUND UP. ⚡','SAVAGE — HIDE THE COMMENT SECTION. 😂','ABSOLUTELY UNCALLED FOR — PHOENIX HAS BEEN WARNED. 🚨😂','MAXIMUM LIVE WIRE — THERE WILL BE NO SURVIVORS. ⚡😂'];
          document.getElementById('savageBtn').onclick=()=>set('savageResult',pick(savage));
          const slotA=['DAN','WILL','LIVE WIRE BAR','PHOENIX','THE BIG BOSS'];const slotB=['MUSIC','BANTER','CHAOS','NICKELBACK','RADIO'];const slotC=['😂','⚡','🚂','🎸','🍹'];
          document.getElementById('slotBtn').onclick=()=>set('slotResult',pick(slotA)+' | '+pick(slotB)+' | '+pick(slotC));
          document.getElementById('chaosBtn').onclick=()=>set('chaosResult',pick(['DAN. THE EVIDENCE IS QUESTIONABLE. 😂','WILL. THE NICKELBACK TRAIL IS STRONG. 🎸','BOTH. CASE CLOSED. ⚡','THE LIVE WIRE BAR. IT KNOWS WHAT IT DID. 🍹','THE MUSIC TRAIN. IT LEFT UNSUPERVISED. 🚂']));
          document.getElementById('excuseBtn').onclick=()=>set('excuseResult',pick(['WILL WAS DELAYED BY A VERY IMPORTANT NICKELBACK EMERGENCY. 🎸','DAN FOUND ONE MORE TUNE AND LOST TRACK OF TIME. 🎶','THE MUSIC TRAIN TOOK A WRONG TURN. 🚂','SOMEONE SAID “QUICK SHOW” AND NOBODY BELIEVED THEM. 😂','PHOENIX WAS BUSY PREPARING HIS ELVIS LIP ACTION. 🎤😂']));
          document.getElementById('karaokeBtn').onclick=()=>set('karaokeResult',pick(['BATHROOM SINGER — CONFIDENCE 100%.','PUB BELTER — THE CROWD HAS BEEN WARNED. 🎤','ALMOST FAMOUS — SOMEONE CALL THE RECORD LABEL. 😂','HEADLINER — ABSOLUTELY NO ONE CAN STOP YOU. ⚡','SOMEONE TAKE THE MIC AWAY. IMMEDIATELY. 😂']));
          const decadeQ=[['Which decade gave us “Mr. Brightside”?',['60s','90s','00s','10s'],'00s'],['Which decade gave us “Dancing Queen”?',['60s','70s','80s','90s'],'70s'],['Which decade gave us “Wannabe”?',['80s','90s','00s','10s'],'90s'],['Which decade gave us “Livin’ on a Prayer”?',['70s','80s','90s','00s'],'80s']];let dq=0;function drawDec(){const q=decadeQ[dq];set('decadeGame',q[0]);const box=document.getElementById('decadeChoices');box.innerHTML='';q[1].forEach(x=>{const b=document.createElement('button');b.className='quirky-choice';b.textContent=x;b.onclick=()=>set('decadeAnswer',x===q[2]?'CORRECT! ⚡':'NOPE — IT WAS THE '+q[2]+'! 😂');box.appendChild(b);});}drawDec();
          const dj=['DJ Disco Dan — RADIO BRAIN ACTIVATED. 📻','Mr Phoenix — NICKELBACK WARNING ISSUED. 🎸','BOTH — YOU WANT THE FULL LIVE WIRE EXPERIENCE. ⚡'];document.getElementById('djBtn').onclick=()=>set('djResult',pick(dj));
          const radio={"60s":"LIVE FROM THE 60s: THE TRANSISTOR IS ON, THE VINYL IS SPINNING AND EVERYONE KNOWS THE CHORUS.","70s":"LIVE FROM THE 70s: DISCO LIGHTS ON, FLARES OUT AND THE DANCEFLOOR IS FILLING UP.","80s":"LIVE FROM THE 80s: SYNTHS UP, HAIR BIG AND TOP OF THE POPS MEMORIES LOADED.","90s":"LIVE FROM THE 90s: CD PLAYER ON, BRITPOP INCOMING AND THE RAVE BUTTON IS READY.","00s":"LIVE FROM THE 00s: MP3 PLAYER CHARGED, RINGTONES LOADED AND THE NOUGHTIES ARE BACK."};document.querySelectorAll('[data-radio]').forEach(b=>b.onclick=()=>set('radioResult',radio[b.dataset.radio]));
          const one=['because one more song is never actually one more. 😂','because the next tune is apparently “essential listening”. 🎶','because the Live Wire Bar has not closed yet. 🍹','because somebody just remembered a forgotten gem. 💎','because stopping now would be sensible — and we don't do sensible. ⚡'];document.getElementById('oneMoreBtn').onclick=()=>set('oneMoreResult','ONE MORE TUNE '+pick(one));
          document.getElementById('ticketBtn').onclick=()=>set('ticketResult','🎫 LIVE WIRE MUSIC TRAIN • '+pick(['FIRST CLASS','BANTER CLASS','NOSTALGIA CLASS','CHAOS CLASS'])+' • '+pick(['80s AVENUE','90s JUNCTION','DISCO STREET','ROCK ’N’ ROLL ROAD','SINGALONG SQUARE'])+' • PASSENGER: LEGEND');
          document.getElementById('railBtn').onclick=()=>set('railResult',pick(['🟢 ON TIME — MIRACULOUSLY.','🟡 DELAYED — PHOENIX IS LOOKING FOR THE CONTROLS.','🔴 CANCELLED — SOMEONE PLAYED NICKELBACK.','😂 RUNNING ON LIVE WIRE TIME.','🚂 FULL STEAM AHEAD — BANTER ON BOARD.']));
          let route=[];document.querySelectorAll('.route').forEach(b=>b.onclick=()=>{if(route.length>=3)route=[];route.push(b.dataset.route);set('routeResult',route.join(' → ')+(route.length===3?' 🚂 JOURNEY COMPLETE!':' — pick '+(3-route.length)+' more'));});
          document.getElementById('challengeBtn').onclick=()=>set('challengeResult',pick(['Who can name five songs from five different decades fastest? ⏱️','Who can survive a Nickelback question without laughing? 🎸😂','Who can go longest without saying “one more tune”? 😂','Who would win a blind music intro battle? 🎧','Who can invent the most ridiculous Live Wire excuse? 🧨']));
          const quotes=[['“I only need one more tune.”','Dan'],['“The Music Train is definitely on time.”','Will'],['“I know that song — give me five minutes and the story.”','Dan'],['“Nickelback belongs in the playlist.”','Will']];let qi=0;function drawQuote(){set('quoteGame',quotes[qi][0]);set('quoteAnswer','Who said it?');}document.querySelectorAll('.quotePick').forEach(b=>b.onclick=()=>set('quoteAnswer',b.dataset.quote===quotes[qi][1]?'CORRECT! 😂':'NOPE — IT WAS '+quotes[qi][1]+'! 😂'));drawQuote();
          const badges=['🎤 THE BANTER MERCHANT','💿 THE NOSTALGIA NUTTER','🚂 THE MUSIC TRAIN MENACE','🍹 THE LIVE WIRE BAR LEGEND','📻 THE RADIO BRAIN','🎸 THE NICKELBACK SURVIVOR','⚡ THE LIVE WIRE CHAOS AGENT'];document.getElementById('badgeBtn').onclick=()=>set('badgeResult',pick(badges));
          const drinks=['THE DISCO DAN — FIZZY, LOUD AND SOMEHOW PLAYING A 70s CLASSIC. 😂','THE PHOENIX — ROCKY, LOUD AND WITH A SUSPICIOUS NICKELBACK AFTERTASTE. 🎸','THE MUSIC TRAIN — ONE PART NOSTALGIA, ONE PART CHAOS. 🚂','THE LIVE WIRE — PURE GOOD VIBES WITH EXTRA BANTER. ⚡','THE BELTER — BUILT FOR SINGING WAY TOO LOUD. 🎤'];document.getElementById('drinkBtn').onclick=()=>set('drinkResult',pick(drinks));
          document.getElementById('orderBtn').onclick=()=>set('orderResult',pick(['ONE FICTIONAL LIVE WIRE SPECIAL + A 90s ANTHEM + MAXIMUM BANTER.','A MOCKTAIL OF CHAOS + 80s CLASSICS + ONE MORE TUNE.','A DISCO FIZZ + FORGOTTEN GEM + A SEAT FAR AWAY FROM THE DJ. 😂','A ROCK ’N’ ROLL REFRESHER + NICKELBACK WARNING + FULL VOLUME. 🎸']));
          document.getElementById('seatBtn').onclick=()=>set('seatResult',pick(['🎧 DJ BOOTH — CLOSE ENOUGH TO BLAME THE DJ.','🍹 BAR STOOL — PRIME BANTER TERRITORY.','💃 DANCEFLOOR — NO EXCUSES, GET MOVING.','🚂 MUSIC TRAIN CARRIAGE — ALL ABOARD.','😂 CHAOS CORNER — YOU KNOW WHAT YOU DID.']));
          document.getElementById('dailyBtn').onclick=()=>set('dailyResult',pick(['NAME THREE 80s SONGS BEFORE YOU CAN SAY “NICKELBACK”. 🎵','DESCRIBE YOUR FAVOURITE SONG WITHOUT USING THE WORD “SONG”. 😂','NAME ONE FORGOTTEN GEM THAT DESERVES A COMEBACK. 💎','DO YOUR BEST DJ INTRO IN TEN SECONDS. 🎙️','PICK A DECADE AND DEFEND IT LIKE YOUR LIFE DEPENDS ON IT. ⚡']));
          })();
          </script>
          '''
          if marker not in s: raise SystemExit('marker not found')
          s=s.replace(marker,insert+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit update and remove updater
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live-wire-extras.html
          git rm .github/workflows/update-fun-arcade.yml
          git commit -m 'Add Live Wire Fun Arcade'
          git push
