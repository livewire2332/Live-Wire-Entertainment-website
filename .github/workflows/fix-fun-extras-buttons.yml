name: Fix Fun & Extras interactive buttons

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[fun-extras-buttons-fixed]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace broken quirky script with working version
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('live-wire-extras.html')
          s = p.read_text(encoding='utf-8')

          # Remove only the script block belonging to the new quirky features.
          scripts = re.findall(r'<script(?:\s[^>]*)?>.*?</script>', s, flags=re.S|re.I)
          for block in scripts:
              if 'dwQuestion' in block and 'randomResult' in block and 'personalityQuestion' in block:
                  s = s.replace(block, '', 1)
                  break

          js = r'''<script>
          (function(){
            'use strict';
            const qs=(x)=>document.querySelector(x);
            const qsa=(x)=>Array.from(document.querySelectorAll(x));

            const dw=[
              ['Who is more likely to start the banter?','Dan probably started it. Will definitely carried it on. 😂'],
              ['Who is more likely to mention the radio?','Dan. Give him five minutes and the radio stories are coming. 📻'],
              ['Who is more likely to sneak Nickelback into the night?','Will. The Nickelback Guarantee remains suspiciously strong. 🎸'],
              ['Who is more likely to turn a simple question into a full conversation?','Dan. Broadcaster mode: ACTIVATED. 🎙️'],
              ['Who is more likely to throw in a random quiz?','Will. Nobody saw it coming. Again. 🧠😂'],
              ['Who is more likely to wind the other one up?','Both. This is Live Wire, after all. 😂⚡']
            ];
            let di=0;
            const dq=qs('#dwQuestion'), da=qs('#dwAnswer');
            function drawDW(){ if(dq)dq.textContent=dw[di][0]; if(da)da.textContent='Choose one...'; }
            qsa('[data-dw]').forEach(b=>b.onclick=function(){ if(da)da.textContent=this.dataset.dw+'? We’ll allow it. '+dw[di][1]; });
            const dn=qs('#dwNext'); if(dn)dn.onclick=function(){di=(di+1)%dw.length;drawDW();};

            const randoms=['YOUR NEXT TUNE SHOULD PROBABLY BE LOUDER. 🔊⚡','YOU HAVE BEEN RANDOMLY ASSIGNED TO 80s AVENUE. 🚂','MR PHOENIX IS CURRENTLY BLAMING NICKELBACK. 🎸😂','DJ DISCO DAN HAS ENTERED RADIO MODE. 📻','THE LIVE WIRE BAR HAS RESERVED YOU A STOOL. 🍹','ONE MORE SONG. GO ON THEN. 🎶','BANTER LEVEL: DANGEROUSLY HIGH. 😂⚡','YOU ARE OFFICIALLY CLEARED FOR GOOD VIBES. 🚀'];
            const rb=qs('#randomBtn'), rr=qs('#randomResult');
            if(rb)rb.onclick=function(){if(rr)rr.textContent=randoms[Math.floor(Math.random()*randoms.length)];};

            const tunes=[
              ['Which song belongs with this clue: “Dancing queen...”',['Dancing Queen','Don’t Stop Me Now','Mr. Brightside'],'Dancing Queen'],
              ['Which song belongs with this clue: “Livin’ on a prayer...”',['Livin’ on a Prayer','Wannabe','Sex on Fire'],'Livin’ on a Prayer'],
              ['Which song belongs with this clue: “Mr. Brightside...”',['Mr. Brightside','Rhythm Is a Dancer','Uptown Funk'],'Mr. Brightside'],
              ['Which song belongs with this clue: “I wanna dance...”',['I Wanna Dance with Somebody','Hips Don’t Lie','Twist and Shout'],'I Wanna Dance with Somebody']
            ];
            let ti=0;
            const tq=qs('#tuneQuestion'), tc=qs('#tuneChoices'), ta=qs('#tuneAnswer');
            function drawTune(){
              if(!tq||!tc||!ta)return;
              const x=tunes[ti]; tq.textContent=x[0]; tc.innerHTML=''; ta.textContent='Your answer is waiting...';
              x[1].forEach(v=>{const b=document.createElement('button');b.type='button';b.className='quirky-choice';b.textContent=v;b.onclick=function(){ta.textContent=v===x[2]?'⚡ CORRECT! Live Wire music brain activated.':'😂 Not quite! The answer is '+x[2]+'.';ti=(ti+1)%tunes.length;setTimeout(drawTune,700);};tc.appendChild(b);});
            }
            drawTune();

            const stops=['80s Avenue','90s Junction','70s Disco Street','00s Rock Road','Forgotten Gems Central','Vinyl Village','Top of the Pops Terrace','Nickelback Junction (Will insists)'];
            const trb=qs('#trainRandomBtn'), trr=qs('#trainRandom');
            if(trb)trb.onclick=function(){if(trr)trr.textContent='NEXT STOP: '+stops[Math.floor(Math.random()*stops.length)].toUpperCase();};

            const personality=[
              ['Your ideal night starts with...',['A microphone and a stack of music history.','A guitar, some rock and probably Nickelback.']],
              ['Pick your natural role...',['The chatty broadcaster.','The quirky one-liner specialist.']],
              ['A surprise quiz appears. You...',['Get ready with a music fact.','Pretend you knew the answer all along. 😂']],
              ['Someone starts the banter. You...',['Keep it going.','Take it up another level. 😂']],
              ['Choose your soundtrack...',['A journey through the decades.','00s rock with a few surprises.']]
            ];
            let pi=0,dan=0,will=0;
            const pq=qs('#personalityQuestion'),pc=qs('#personalityChoices'),pr=qs('#personalityResult');
            function drawPersonality(){
              if(!pq||!pc||!pr)return;
              if(pi>=personality.length){
                const result=dan>will?'DAN MODE':will>dan?'WILL MODE':'FULL LIVE WIRE MODE';
                pq.textContent='⚡ RESULT: '+result;pc.innerHTML='';pr.textContent=dan===will?'Perfectly balanced. You’re basically Live Wire itself. 😂⚡':'Your Live Wire personality is leaning '+result+'. ⚡';return;
              }
              const x=personality[pi];pq.textContent=x[0];pc.innerHTML='';pr.textContent='Question '+(pi+1)+' of '+personality.length;
              x[1].forEach((v,i)=>{const b=document.createElement('button');b.type='button';b.className='quirky-choice';b.textContent=v;b.onclick=function(){if(i===0)dan++;else will++;pi++;drawPersonality();};pc.appendChild(b);});
            }
            drawPersonality();
            drawDW();
          })();
          </script>'''

          s = s.replace('</body>', js + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fix and remove this one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-fun-extras-buttons.yml
          git add live-wire-extras.html .github/workflows/fix-fun-extras-buttons.yml
          git commit -m "Fix Fun & Extras interactive buttons [fun-extras-buttons-fixed]"
          git push
